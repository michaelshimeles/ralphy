name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test and Lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Keep running other OS tests if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ./cli

      - name: Lint & Format (Biome)
        # 'ci' combines lint + format check and creates GH Annotations
        run: bunx @biomejs/biome ci . --max-diagnostics 200
        working-directory: ./cli

      - name: Run tests
        run: bun test
        working-directory: ./cli

      - name: Build project
        run: bun run build
        working-directory: ./cli

      - name: Security audit
        run: bun audit
        working-directory: ./cli

  lint-landing:
    name: Lint Landing Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './landing/package-lock.json'

      - name: Install dependencies
        run: npm ci # Use 'ci' for reproducible builds
        working-directory: ./landing

      - name: Run linting
        run: npm run lint
        working-directory: ./landing

      - name: Build landing page
        run: npm run build
        working-directory: ./landing

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ./cli

      - name: Type check
        run: bunx tsc --noEmit
        working-directory: ./cli