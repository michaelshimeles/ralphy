name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Run type check
      run: bun run typecheck
      
    - name: Run linting
      run: bun run lint
      
    - name: Run tests
      run: bun test
      
    - name: Build project
      run: bun run build:all
      
    - name: Check bundle size
      run: |
        ls -la dist/ || echo "No dist directory found"
        
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Run security tests
      run: bun test __tests__/sandbox-security.test.ts __tests__/locking-security.test.ts